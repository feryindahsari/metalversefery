<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Digital Interaktif: Teknik Fabrikasi Logam & Manufaktur Fase F</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#F0F9FF',
              100: '#E0F2FE',
              500: '#0EA5E9',
              600: '#0284C7',
              700: '#0369A1',
              800: '#075985',
              900: '#0C4A6E',
            },
            metal: {
              800: '#1E293B',
              850: '#162032',
              900: '#0F172A',
              950: '#080E1A',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Merriweather', 'Georgia', 'serif'],
            heading: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ================================================================ */
    /* PINTEREST CLAYMORPHISM THEME SYSTEM (WARNA DASHBOARD)            */
    /* Inspired by Dashboard MetalVerseFery                             */
    /* ================================================================ */
    :root {
      --clay-canvas: #F7F2EB;
      --clay-card: #FFFFFF;
      --clay-sidebar: #C8DBD3;
      --clay-border: #E6DCD1;
      --clay-text: #2B221E;
      --clay-text-muted: #7A6B64;
      --clay-terracotta: #EA734F;
      --clay-sage: #568A7D;
      --clay-peach: #FCE6DD;
      --clay-mint: #DCEBE4;
      --clay-honey: #E5A842;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #EFE8DF;
    }
    ::-webkit-scrollbar-thumb {
      background: #D3C5B8;
      border-radius: 9999px;
      border: 2px solid #EFE8DF;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #B9A899;
    }

    /* ================= THEME 1: DASHBOARD CLAY (DEFAULT) ================= */
    body.theme-clay {
      background-color: #F7F2EB !important;
      color: #2B221E !important;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif !important;
    }
    body.theme-clay .reader-card {
      background-color: #FFFFFF !important;
      border-color: #E6DCD1 !important;
      color: #2B221E !important;
      box-shadow: 0 12px 28px -6px rgba(160, 135, 120, 0.10), 0 4px 10px -2px rgba(160, 135, 120, 0.05), inset 0 2px 3px rgba(255, 255, 255, 0.95) !important;
    }
    body.theme-clay .reader-nav {
      background-color: #FFFFFF !important;
      border-color: #E6DCD1 !important;
      color: #2B221E !important;
      box-shadow: 0 4px 16px -2px rgba(160, 135, 120, 0.08) !important;
    }
    body.theme-clay #book-sidebar {
      background-color: #F7F2EB !important;
      border-color: #E6DCD1 !important;
      color: #2B221E !important;
    }

    /* QUIZ & QUESTION BACKGROUNDS IN THEME CLAY (WARNA DASHBOARD) */
    body.theme-clay .quiz-wrapper {
      background-color: #FAF5EF !important;
      border: 2px solid #E8DDD2 !important;
      box-shadow: 0 16px 36px -8px rgba(160, 135, 120, 0.12), inset 0 2px 4px rgba(255, 255, 255, 0.95) !important;
    }
    body.theme-clay .question-card-box {
      background-color: #FFFFFF !important;
      border: 1.5px solid #E6DCD1 !important;
      box-shadow: 0 4px 14px rgba(160, 135, 120, 0.06), inset 0 1px 2px rgba(255, 255, 255, 0.8) !important;
    }
    body.theme-clay .question-card-box:hover {
      border-color: #EA734F !important;
    }
    body.theme-clay .question-card-box.is-correct {
      background-color: #F0FDF4 !important;
      border: 2px solid #86EFAC !important;
    }
    body.theme-clay .question-card-box.is-wrong {
      background-color: #FEF2F2 !important;
      border: 2px solid #FCA5A5 !important;
    }
    body.theme-clay .question-card-box.is-unanswered {
      background-color: #FFFBEB !important;
      border: 2px solid #FCD34D !important;
    }

    body.theme-clay .opt-btn {
      background-color: #FFFFFF !important;
      border: 1.5px solid #E6DCD1 !important;
      color: #2B221E !important;
    }
    body.theme-clay .opt-btn:hover {
      background-color: #FAF5EE !important;
      border-color: #EA734F !important;
      transform: translateY(-1px);
    }
    body.theme-clay .opt-badge {
      background-color: #F5EFE6 !important;
      color: #4F433E !important;
      border: 1px solid #E6DCD1 !important;
    }
    body.theme-clay .opt-btn.is-selected {
      background-color: #FCE6DD !important;
      border: 2px solid #EA734F !important;
      color: #2B221E !important;
      font-weight: 600 !important;
      box-shadow: 0 4px 12px rgba(234, 115, 79, 0.18) !important;
    }
    body.theme-clay .opt-btn.is-selected .opt-badge {
      background-color: #EA734F !important;
      color: #FFFFFF !important;
      border-color: #EA734F !important;
    }
    body.theme-clay .opt-btn.is-correct {
      background-color: #E6F4EA !important;
      border: 2px solid #166534 !important;
      color: #166534 !important;
      font-weight: 600 !important;
    }
    body.theme-clay .opt-btn.is-correct .opt-badge {
      background-color: #166534 !important;
      color: #FFFFFF !important;
      border-color: #166534 !important;
    }
    body.theme-clay .opt-btn.is-wrong {
      background-color: #FEE2E2 !important;
      border: 2px solid #DC2626 !important;
      color: #991B1B !important;
      font-weight: 600 !important;
    }
    body.theme-clay .opt-btn.is-wrong .opt-badge {
      background-color: #DC2626 !important;
      color: #FFFFFF !important;
      border-color: #DC2626 !important;
    }

    body.theme-clay .explanation-box {
      background-color: #FAF5EE !important;
      border: 1.5px solid #E6DCD1 !important;
      color: #382D28 !important;
    }
    body.theme-clay .explanation-box.is-correct {
      background-color: #F0FDF4 !important;
      border-color: #86EFAC !important;
      color: #166534 !important;
    }

    /* Clay Overrides for Typography & Neutral Elements */
    body.theme-clay h1, 
    body.theme-clay h2, 
    body.theme-clay h3, 
    body.theme-clay h4, 
    body.theme-clay h5, 
    body.theme-clay h6 {
      color: #2B221E;
    }
    body.theme-clay .text-white {
      color: #2B221E !important;
    }
    body.theme-clay .text-slate-200, 
    body.theme-clay .text-slate-300 {
      color: #382D28 !important;
    }
    body.theme-clay .text-slate-400 {
      color: #72645D !important;
    }
    body.theme-clay .text-slate-500 {
      color: #93847C !important;
    }
    body.theme-clay .border-slate-800,
    body.theme-clay .border-slate-700 {
      border-color: #E6DCD1 !important;
    }

    /* ================= THEME 2: SEPIA ================= */
    body.theme-sepia {
      background-color: #F8F4EC;
      color: #382D24;
    }
    body.theme-sepia .reader-card {
      background-color: #FFFDF9;
      border-color: #E6DCD1;
      color: #382D24;
    }
    body.theme-sepia .reader-nav {
      background-color: #EFE8DF;
      border-color: #DFD5C6;
      color: #382D24;
    }
    body.theme-sepia .quiz-wrapper {
      background-color: #F4EDE2 !important;
      border: 2px solid #E6DCD1 !important;
    }
    body.theme-sepia .question-card-box {
      background-color: #FFFDF9 !important;
      border: 1.5px solid #E6DCD1 !important;
    }
    body.theme-sepia .opt-btn {
      background-color: #FFFDF9 !important;
      border: 1.5px solid #DFD5C6 !important;
      color: #382D24 !important;
    }
    body.theme-sepia .explanation-box {
      background-color: #EFE8DF !important;
      border: 1px solid #DFD5C6 !important;
      color: #382D24 !important;
    }

    /* ================= THEME 3: CLEAN LIGHT ================= */
    body.theme-light {
      background-color: #F8FAFC;
      color: #0F172A;
    }
    body.theme-light .reader-card {
      background-color: #FFFFFF;
      border-color: #E2E8F0;
      color: #0F172A;
    }
    body.theme-light .reader-nav {
      background-color: #FFFFFF;
      border-color: #CBD5E1;
      color: #0F172A;
    }
    body.theme-light .quiz-wrapper {
      background-color: #F1F5F9 !important;
      border: 2px solid #CBD5E1 !important;
    }
    body.theme-light .question-card-box {
      background-color: #FFFFFF !important;
      border: 1.5px solid #E2E8F0 !important;
    }
    body.theme-light .opt-btn {
      background-color: #FFFFFF !important;
      border: 1.5px solid #CBD5E1 !important;
      color: #0F172A !important;
    }
    body.theme-light .explanation-box {
      background-color: #F8FAFC !important;
      border: 1px solid #E2E8F0 !important;
      color: #0F172A !important;
    }

    /* ================= THEME 4: STUDIO DARK ================= */
    body.theme-dark {
      background-color: #0b1120;
      color: #e2e8f0;
    }
    body.theme-dark .reader-card {
      background-color: #0F172A;
      border-color: #1E293B;
      color: #E2E8F0;
    }
    body.theme-dark .reader-nav {
      background-color: #0F172A;
      border-color: #1E293B;
      color: #E2E8F0;
    }
    body.theme-dark .quiz-wrapper {
      background-color: #080E1A !important;
      border: 2px solid #1E293B !important;
    }
    body.theme-dark .question-card-box {
      background-color: #0F172A !important;
      border: 1.5px solid #1E293B !important;
    }
    body.theme-dark .opt-btn {
      background-color: #162032 !important;
      border: 1.5px solid #1E293B !important;
      color: #E2E8F0 !important;
    }
    body.theme-dark .explanation-box {
      background-color: #162032 !important;
      border: 1px solid #1E293B !important;
      color: #CBD5E1 !important;
    }

    /* Option button base transitions */
    .opt-btn {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Highlight pulse */
    @keyframes pulse-highlight {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .pulse-highlight {
      animation: pulse-highlight 1.5s infinite;
    }
  </style>
</head>
<body class="theme-clay h-full flex flex-col font-sans transition-colors duration-200">

  <!-- ================= TOP APP BAR ================= -->
  <header class="reader-nav backdrop-blur-md border-b shrink-0 sticky top-0 z-40 px-3 sm:px-6 py-2.5 flex items-center justify-between gap-3 shadow-xs transition-colors duration-200">
    
    <!-- Left: Drawer Toggle & Book Info -->
    <div class="flex items-center gap-3 min-w-0">
      <button onclick="toggleSidebar()" class="p-2 rounded-xl bg-[#FAF5EE] hover:bg-[#EFE8DF] text-[#2B221E] border border-[#E6DCD1] transition cursor-pointer" title="Buka Daftar Isi">
        <i class="fa-solid fa-bars text-sm"></i>
      </button>

      <div class="flex items-center gap-2.5 min-w-0">
        <span class="w-8 h-8 rounded-lg bg-gradient-to-tr from-[#EA734F] to-[#D95D39] text-white flex items-center justify-center font-bold text-xs shrink-0 shadow-md">
          <i class="fa-solid fa-book-open"></i>
        </span>
        <div class="truncate">
          <div class="flex items-center gap-2">
            <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold uppercase tracking-wider bg-[#FCE6DD] text-[#EA734F] border border-[#FDBA74]">E-Book Interaktif</span>
            <span id="current-chapter-pill" class="text-[11px] text-[#7A6B64] font-medium truncate hidden sm:inline">BAB I</span>
          </div>
          <h1 class="text-xs sm:text-sm font-heading font-bold text-[#2B221E] truncate max-w-xs sm:max-w-md md:max-w-xl">
            Teknik Fabrikasi Logam & Manufaktur Fase F
          </h1>
        </div>
      </div>
    </div>

    <!-- Center/Right Controls -->
    <div class="flex items-center gap-2 shrink-0">
      
      <!-- Search Input in Book -->
      <div class="relative hidden md:block">
        <input type="text" id="book-search-input" onkeyup="handleBookSearch(event)" placeholder="Cari materi atau kuis..." class="w-44 lg:w-60 px-3 py-1.5 pl-8 rounded-xl bg-[#FAF5EE] border border-[#E6DCD1] text-xs text-[#2B221E] placeholder-[#7A6B64] focus:outline-none focus:border-[#EA734F] focus:ring-1 focus:ring-[#EA734F] transition">
        <i class="fa-solid fa-magnifying-glass text-[#7A6B64] absolute left-2.5 top-2.5 text-xs"></i>
      </div>

      <!-- Mode Selector Tabs -->
      <div class="hidden sm:flex items-center bg-[#FAF5EE] p-1 rounded-xl border border-[#E6DCD1] text-xs">
        <button onclick="setViewMode('read')" id="mode-btn-read" class="px-3 py-1 rounded-lg font-bold transition bg-[#EA734F] text-white shadow-xs flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-book"></i>
          <span>Materi</span>
        </button>
        <button onclick="setViewMode('quiz')" id="mode-btn-quiz" class="px-3 py-1 rounded-lg font-semibold text-[#7A6B64] hover:text-[#2B221E] transition flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-circle-question text-[#EA734F]"></i>
          <span>Kuis</span>
          <span id="quiz-count-badge" class="px-1.5 py-0.2 rounded-full text-[9px] bg-[#FCE6DD] text-[#EA734F] font-mono font-bold">120</span>
        </button>
        <button onclick="setViewMode('jobsheet')" id="mode-btn-jobsheet" class="px-3 py-1 rounded-lg font-semibold text-[#7A6B64] hover:text-[#2B221E] transition flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-wrench text-[#568A7D]"></i>
          <span>Job Sheet</span>
        </button>
        <button onclick="resetAllQuizzes()" class="px-2.5 py-1 rounded-lg font-semibold text-[#7A6B64] hover:text-[#DC2626] hover:bg-[#FEE2E2]/60 transition flex items-center gap-1 cursor-pointer" title="Reset Lembar Ujian (Sembunyikan Semua Kunci untuk Siswa Baru)">
          <i class="fa-solid fa-rotate-left text-xs"></i>
          <span class="hidden xl:inline">Reset Kuis</span>
        </button>
      </div>

      <!-- Reading Theme Toggle -->
      <div class="relative">
        <button onclick="toggleThemeMenu()" class="p-2 rounded-xl bg-[#FAF5EE] hover:bg-[#EFE8DF] text-[#2B221E] border border-[#E6DCD1] transition text-xs flex items-center gap-1.5 cursor-pointer" title="Tema Pembaca">
          <i class="fa-solid fa-palette text-[#EA734F]"></i>
          <span id="theme-label" class="hidden lg:inline text-[11px] font-medium">Dashboard</span>
        </button>
        <div id="theme-menu" class="hidden absolute right-0 mt-2 w-44 bg-white border border-[#E6DCD1] rounded-2xl shadow-xl py-1.5 z-50 text-xs">
          <button onclick="setTheme('clay')" class="w-full text-left px-3.5 py-2 hover:bg-[#FAF5EE] flex items-center gap-2.5 text-[#2B221E] font-medium cursor-pointer">
            <span class="w-4 h-4 rounded-full bg-[#F7F2EB] border-2 border-[#EA734F]"></span>
            <span>Dashboard Clay</span>
          </button>
          <button onclick="setTheme('light')" class="w-full text-left px-3.5 py-2 hover:bg-[#FAF5EE] flex items-center gap-2.5 text-[#2B221E] cursor-pointer">
            <span class="w-4 h-4 rounded-full bg-white border border-slate-300"></span>
            <span>Clean Light</span>
          </button>
          <button onclick="setTheme('sepia')" class="w-full text-left px-3.5 py-2 hover:bg-[#FAF5EE] flex items-center gap-2.5 text-[#2B221E] cursor-pointer">
            <span class="w-4 h-4 rounded-full bg-[#EFE8DF] border border-[#C8B8A6]"></span>
            <span>Warm Sepia</span>
          </button>
          <button onclick="setTheme('dark')" class="w-full text-left px-3.5 py-2 hover:bg-[#FAF5EE] flex items-center gap-2.5 text-[#2B221E] cursor-pointer">
            <span class="w-4 h-4 rounded-full bg-[#0F172A] border border-slate-700"></span>
            <span>Studio Dark</span>
          </button>
        </div>
      </div>

      <!-- Font Size Resizer -->
      <div class="hidden md:flex items-center gap-1 bg-[#FAF5EE] p-1 rounded-xl border border-[#E6DCD1] text-xs">
        <button onclick="adjustFontSize(-1)" class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-[#EFE8DF] text-[#7A6B64] hover:text-[#2B221E] cursor-pointer" title="Kecilkan Font">A-</button>
        <button onclick="adjustFontSize(1)" class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-[#EFE8DF] text-[#7A6B64] hover:text-[#2B221E] font-bold cursor-pointer" title="Besarkan Font">A+</button>
      </div>

      <!-- User Session Pill & Switch Student -->
      <div id="book-student-pill" class="hidden sm:inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-[#FAF5EE] border border-[#E6DCD1] text-xs shadow-xs">
        <span class="text-[#EA734F] text-sm"><i class="fa-solid fa-circle-user"></i></span>
        <div class="flex flex-col text-left leading-tight">
          <span id="book-student-name" class="font-extrabold text-[#2B221E] text-[11px] truncate max-w-[130px]">Peserta Didik</span>
          <span id="book-student-detail" class="text-[9px] text-[#7A6B64] font-mono">Presensi: 01 | XI TPFL</span>
        </div>
        <button onclick="promptSwitchStudentBook()" class="ml-1 text-[10px] font-bold text-[#0284C7] hover:underline cursor-pointer" title="Ganti Identitas / Siswa Baru">
          Ganti
        </button>
      </div>

      <!-- Back to Lab Button -->
      <a href="MetalVerseFery.html" class="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-[#568A7D] to-[#40685E] hover:from-[#40685E] hover:to-[#33534B] text-white font-bold text-xs shadow-md transition flex items-center gap-1.5" title="Kembali ke Labs MetalVerse">
        <i class="fa-solid fa-arrow-left"></i>
        <span class="hidden sm:inline">Kembali ke Labs</span>
      </a>

    </div>
  </header>

  <!-- Reading Progress Bar -->
  <div class="w-full bg-[#E6DCD1] h-1 shrink-0">
    <div id="reading-progress-bar" class="bg-gradient-to-r from-[#EA734F] to-[#E5A842] h-full w-0 transition-all duration-150"></div>
  </div>

  <!-- ================= MAIN CONTAINER ================= -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- ================= SIDEBAR (Table of Contents) ================= -->
    <aside id="book-sidebar" class="w-80 lg:w-84 border-r border-[#E6DCD1] flex flex-col shrink-0 transition-all duration-300 z-30 absolute inset-y-0 left-0 lg:static lg:translate-x-0 -translate-x-full">
      
      <!-- Sidebar Header -->
      <div class="p-4 border-b border-[#E6DCD1] flex items-center justify-between">
        <div>
          <h2 class="font-heading font-extrabold text-sm text-[#2B221E]">Daftar Isi & Modul</h2>
          <p class="text-[11px] text-[#7A6B64]">11 Bab Materi & 9 Job Sheet Praktik</p>
        </div>
        <button onclick="toggleSidebar()" class="lg:hidden p-1.5 text-[#7A6B64] hover:text-[#2B221E] rounded-lg">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>
      </div>

      <!-- Navigation Filter Buttons -->
      <div class="p-3 border-b border-[#E6DCD1] flex items-center gap-1.5 text-xs">
        <button onclick="filterToc('all')" id="toc-btn-all" class="flex-1 py-1.5 rounded-lg bg-[#EA734F] text-white font-bold text-center transition cursor-pointer shadow-xs">Semua</button>
        <button onclick="filterToc('bab')" id="toc-btn-bab" class="flex-1 py-1.5 rounded-lg bg-white hover:bg-[#FAF5EE] text-[#4F433E] border border-[#E6DCD1] text-center transition font-semibold cursor-pointer">11 Bab</button>
        <button onclick="filterToc('jobsheet')" id="toc-btn-jobsheet" class="flex-1 py-1.5 rounded-lg bg-white hover:bg-[#FAF5EE] text-[#4F433E] border border-[#E6DCD1] text-center transition font-semibold cursor-pointer">9 Praktik</button>
      </div>

      <!-- TOC Chapter List -->
      <div id="toc-list" class="flex-1 overflow-y-auto p-3 space-y-1.5 text-xs">
        <!-- Dynamically Populated by renderToc() -->
      </div>

      <!-- Sidebar Footer (Cumulative Quiz Progress) -->
      <div class="p-4 bg-white border-t border-[#E6DCD1]">
        <div class="flex items-center justify-between text-xs mb-1.5">
          <span class="font-bold text-[#2B221E]">Skor Kuis Keseluruhan</span>
          <span id="sidebar-total-score" class="font-mono font-bold text-[#EA734F]">0 / 120 (0%)</span>
        </div>
        <div class="w-full bg-[#EFE8DF] h-2 rounded-full overflow-hidden">
          <div id="sidebar-score-bar" class="bg-gradient-to-r from-[#EA734F] to-[#568A7D] h-full w-0 transition-all duration-300"></div>
        </div>
        <div class="mt-2.5 flex items-center justify-between text-[11px] text-[#7A6B64]">
          <span>Penyusun: Fery N.I, S.Pd</span>
          <button onclick="resetAllQuizzes()" class="text-[#DC2626] hover:text-[#991B1B] underline cursor-pointer" title="Reset semua jawaban">Reset Kuis</button>
        </div>
      </div>

    </aside>

    <!-- Overlay backdrop for mobile sidebar -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-20 lg:hidden"></div>

    <!-- ================= MAIN CONTENT VIEWPORT ================= -->
    <main id="main-content-viewport" onscroll="handleContentScroll()" class="flex-1 overflow-y-auto px-4 sm:px-8 lg:px-16 py-8 space-y-8 scroll-smooth">
      
      <!-- Content Container (Constrained width for comfortable reading) -->
      <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- Search Results Panel (Hidden by default) -->
        <div id="search-results-panel" class="hidden p-6 rounded-2xl bg-white border border-[#E6DCD1] shadow-xl space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="font-heading font-bold text-[#2B221E] text-base flex items-center gap-2">
              <i class="fa-solid fa-magnifying-glass text-[#EA734F]"></i>
              <span>Hasil Pencarian: "<span id="search-query-text" class="text-[#EA734F]"></span>"</span>
            </h3>
            <button onclick="closeSearchResults()" class="p-1 text-[#7A6B64] hover:text-[#2B221E]">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div id="search-results-list" class="space-y-2 text-xs"></div>
        </div>

        <!-- Dynamic Content Body -->
        <article id="reader-body" class="reader-card p-6 sm:p-10 rounded-3xl border space-y-8">
          <!-- Dynamically Injected by renderActiveSection() -->
        </article>

        <!-- Chapter Navigation Footer -->
        <div class="flex items-center justify-between gap-4 pt-6 border-t border-[#E6DCD1]">
          <button id="btn-prev-chap" onclick="navigateChapter(-1)" class="px-4 py-2.5 rounded-xl bg-white hover:bg-[#FAF5EE] border border-[#E6DCD1] text-[#2B221E] text-xs font-bold transition flex items-center gap-2 cursor-pointer shadow-xs">
            <i class="fa-solid fa-arrow-left"></i>
            <span id="btn-prev-label">Bab Sebelumnya</span>
          </button>

          <div class="flex items-center gap-2">
            <button onclick="scrollToTop()" class="p-2.5 rounded-xl bg-white hover:bg-[#FAF5EE] border border-[#E6DCD1] text-[#7A6B64] hover:text-[#2B221E] text-xs transition cursor-pointer shadow-xs" title="Kembali ke Atas">
              <i class="fa-solid fa-arrow-up"></i>
            </button>
            <button onclick="jumpToQuiz()" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-[#EA734F] to-[#D95D39] hover:from-[#D95D39] hover:to-[#C2410C] text-white text-xs font-bold transition flex items-center gap-2 shadow-md cursor-pointer">
              <i class="fa-solid fa-circle-question"></i>
              <span>Kerjakan Kuis Bab Ini</span>
            </button>
          </div>

          <button id="btn-next-chap" onclick="navigateChapter(1)" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-[#568A7D] to-[#40685E] hover:from-[#40685E] hover:to-[#33534B] text-white text-xs font-bold transition flex items-center gap-2 shadow-md cursor-pointer">
            <span id="btn-next-label">Bab Berikutnya</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>

      </div>

    </main>

  </div>

  <!-- Image Lightbox Modal -->
  <div id="image-modal" onclick="closeImageModal()" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="max-w-5xl max-h-[90vh] flex flex-col items-center">
      <img id="modal-img-tag" src="" alt="Zoom Image" class="max-w-full max-h-[80vh] object-contain rounded-xl shadow-2xl border border-slate-700">
      <p id="modal-caption-text" class="text-xs text-slate-300 font-semibold text-center mt-3 max-w-2xl px-4 py-2 bg-slate-900/90 rounded-xl border border-slate-800"></p>
    </div>
  </div>

  <!-- Load Extracted Curriculum & Quiz Data -->
  <script src="buku_data.js"></script>

  <!-- Interactive E-Book Application Logic -->
  <script>
    // App State
    let currentChapterIndex = 0; // 0 to 10 (Bab 1 - 11)
    let currentJobSheetIndex = -1; // -1 = Viewing chapter; >=0 = Viewing Job Sheet
    let activeViewMode = 'read'; // 'read' | 'quiz' | 'jobsheet'
    let currentFontSize = 16; // base font size in px
    let studentAnswers = {}; // { 'bab-1': { 1: 'B', 2: 'D' ... }, 'bab-2': ... }
    let quizSubmitted = {}; // { 'bab-1': true / false }
    let studentEssayAnswers = {}; // { 'bab-1': { 1: "Jawaban no 1...", 2: "..." }, ... }
    let essayScores = {}; // { 'bab-1': { score: 90, filledCount: 6, total: 6, gradedAt: "..." } }
    let currentAssessmentTab = {}; // { 'bab-1': 'all' | 'pg' | 'essay' }

    // Audio SFX synthesis using Web Audio API
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playSound(type) {
      try {
        const ctx = getAudioCtx();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
          osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(150, now + 0.2);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'fanfare') {
          osc.type = 'triangle';
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, now + i * 0.1);
            g.gain.setValueAtTime(0.15, now + i * 0.1);
            g.gain.linearRampToValueAtTime(0.01, now + (i + 1) * 0.1 + 0.2);
            o.connect(g);
            g.connect(ctx.destination);
            o.start(now + i * 0.1);
            o.stop(now + (i + 1) * 0.1 + 0.2);
          });
        }
      } catch (e) {
        console.warn('Audio not available:', e);
      }
    }

    // LocalStorage State Management
    function loadSavedState() {
      try {
        const savedAns = localStorage.getItem('metalverse_buku_answers');
        if (savedAns) studentAnswers = JSON.parse(savedAns);

        const savedSub = localStorage.getItem('metalverse_buku_submitted');
        if (savedSub) quizSubmitted = JSON.parse(savedSub);

        const savedEssay = localStorage.getItem('metalverse_buku_essay_answers');
        if (savedEssay) studentEssayAnswers = JSON.parse(savedEssay);

        const savedEssayScores = localStorage.getItem('metalverse_buku_essay_scores');
        if (savedEssayScores) essayScores = JSON.parse(savedEssayScores);

        const savedChap = localStorage.getItem('metalverse_buku_last_chapter');
        if (savedChap !== null) currentChapterIndex = parseInt(savedChap, 10) || 0;

        let savedTheme = localStorage.getItem('metalverse_buku_theme');
        // Default to 'clay' (Dashboard Theme) as requested:
        if (!savedTheme || savedTheme === 'dark') {
          savedTheme = 'clay';
        }
        setTheme(savedTheme);
      } catch (e) {
        console.warn('Could not load localStorage:', e);
        setTheme('clay');
      }
    }

    function saveState() {
      try {
        localStorage.setItem('metalverse_buku_answers', JSON.stringify(studentAnswers));
        localStorage.setItem('metalverse_buku_submitted', JSON.stringify(quizSubmitted));
        localStorage.setItem('metalverse_buku_essay_answers', JSON.stringify(studentEssayAnswers));
        localStorage.setItem('metalverse_buku_essay_scores', JSON.stringify(essayScores));
        localStorage.setItem('metalverse_buku_last_chapter', currentChapterIndex.toString());
      } catch (e) {
        console.warn('Could not save to localStorage:', e);
      }
    }

    // Theme Switcher
    function setTheme(theme) {
      if (!['clay', 'sepia', 'light', 'dark'].includes(theme)) theme = 'clay';
      document.body.className = `theme-${theme} h-full flex flex-col font-sans transition-colors duration-200`;
      const labelMap = { clay: 'Dashboard', sepia: 'Sepia', light: 'Light', dark: 'Dark' };
      const labelEl = document.getElementById('theme-label');
      if (labelEl) labelEl.innerText = labelMap[theme] || 'Dashboard';
      const menu = document.getElementById('theme-menu');
      if (menu) menu.classList.add('hidden');
      try { localStorage.setItem('metalverse_buku_theme', theme); } catch (e) {}
    }

    function toggleThemeMenu() {
      document.getElementById('theme-menu').classList.toggle('hidden');
    }

    // Font Size Adjuster
    function adjustFontSize(delta) {
      currentFontSize = Math.max(13, Math.min(22, currentFontSize + delta));
      const body = document.getElementById('reader-body');
      body.style.fontSize = `${currentFontSize}px`;
    }

    // Sidebar Toggle
    function toggleSidebar() {
      const sb = document.getElementById('book-sidebar');
      const ov = document.getElementById('sidebar-overlay');
      const isOpen = !sb.classList.contains('-translate-x-full');
      if (isOpen) {
        sb.classList.add('-translate-x-full');
        ov.classList.add('hidden');
      } else {
        sb.classList.remove('-translate-x-full');
        ov.classList.remove('hidden');
      }
    }

    // View Mode Setter ('read' | 'quiz' | 'jobsheet')
    function setViewMode(mode) {
      activeViewMode = mode;
      playSound('click');
      document.querySelectorAll('#mode-btn-read, #mode-btn-quiz, #mode-btn-jobsheet').forEach(b => {
        b.className = 'px-3 py-1 rounded-lg font-semibold text-[#7A6B64] hover:text-[#2B221E] transition flex items-center gap-1.5 cursor-pointer';
      });

      if (mode === 'read') {
        document.getElementById('mode-btn-read').className = 'px-3 py-1 rounded-lg font-bold transition bg-[#EA734F] text-white shadow-xs flex items-center gap-1.5 cursor-pointer';
        currentJobSheetIndex = -1;
      } else if (mode === 'quiz') {
        document.getElementById('mode-btn-quiz').className = 'px-3 py-1 rounded-lg font-bold transition bg-[#EA734F] text-white shadow-xs flex items-center gap-1.5 cursor-pointer';
        currentJobSheetIndex = -1;
      } else if (mode === 'jobsheet') {
        document.getElementById('mode-btn-jobsheet').className = 'px-3 py-1 rounded-lg font-bold transition bg-[#568A7D] text-white shadow-xs flex items-center gap-1.5 cursor-pointer';
        if (currentJobSheetIndex < 0) currentJobSheetIndex = 0;
      }

      renderActiveSection();
      renderToc();
    }

    // Render TOC
    let tocFilter = 'all';
    function filterToc(filt) {
      tocFilter = filt;
      ['all', 'bab', 'jobsheet'].forEach(f => {
        const btn = document.getElementById(`toc-btn-${f}`);
        if (!btn) return;
        if (f === filt) {
          btn.className = 'flex-1 py-1.5 rounded-lg bg-[#EA734F] text-white font-bold text-center transition cursor-pointer shadow-xs';
        } else {
          btn.className = 'flex-1 py-1.5 rounded-lg bg-white hover:bg-[#FAF5EE] text-[#4F433E] border border-[#E6DCD1] text-center transition font-semibold cursor-pointer';
        }
      });
      renderToc();
    }

    function renderToc() {
      const container = document.getElementById('toc-list');
      if (!window.BUKU_DATA) {
        container.innerHTML = '<p class="text-[#7A6B64] text-center py-4">Data buku sedang dimuat...</p>';
        return;
      }

      const chapters = window.BUKU_DATA.chapters || [];
      const jobSheets = window.BUKU_DATA.jobSheets || [];
      let html = '';

      // Chapters List
      if (tocFilter === 'all' || tocFilter === 'bab') {
        html += `<p class="px-2 pt-2 pb-1 text-[10px] font-bold uppercase tracking-wider text-[#EA734F]">Modul Teori (11 Bab)</p>`;
        chapters.forEach((chap, idx) => {
          const isActive = currentJobSheetIndex === -1 && currentChapterIndex === idx;
          const scoreInfo = getChapterScore(chap.id);
          const isSubmitted = quizSubmitted[chap.id];

          let badgeHtml = '';
          if (isSubmitted) {
            badgeHtml = `<span class="px-1.5 py-0.5 rounded text-[9px] font-mono font-bold ${scoreInfo.score >= 75 ? 'bg-[#E6F4EA] text-[#166534] border border-[#86EFAC]' : 'bg-[#FEF3C7] text-[#92400E] border border-[#FCD34D]'}">${scoreInfo.score}%</span>`;
          } else {
            badgeHtml = `<span class="px-1.5 py-0.5 rounded text-[9px] font-mono text-[#7A6B64] bg-[#FAF5EE] border border-[#E6DCD1]">10 Soal</span>`;
          }

          html += `
            <div onclick="selectChapter(${idx})" class="p-2.5 rounded-xl cursor-pointer transition flex items-center justify-between gap-2 ${isActive ? 'bg-white border-2 border-[#EA734F] text-[#2B221E] shadow-sm font-bold' : 'hover:bg-white text-[#4F433E] border border-transparent'}">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="w-6 h-6 rounded-md ${isActive ? 'bg-[#EA734F] text-white' : 'bg-[#FAF5EE] text-[#7A6B64] border border-[#E6DCD1]'} flex items-center justify-center font-mono font-bold text-[10px] shrink-0">
                  ${idx + 1}
                </span>
                <span class="truncate font-medium text-xs">${chap.numberStr}: ${chap.title.replace(/^BAB\s+[A-Z]+:\s*/, '')}</span>
              </div>
              ${badgeHtml}
            </div>
          `;
        });
      }

      // Job Sheets List
      if (tocFilter === 'all' || tocFilter === 'jobsheet') {
        html += `<p class="px-2 pt-4 pb-1 text-[10px] font-bold uppercase tracking-wider text-[#568A7D]">Praktik Bengkel (9 Job Sheet)</p>`;
        jobSheets.forEach((js, idx) => {
          const isActive = currentJobSheetIndex === idx;
          html += `
            <div onclick="selectJobSheet(${idx})" class="p-2.5 rounded-xl cursor-pointer transition flex items-center justify-between gap-2 ${isActive ? 'bg-white border-2 border-[#568A7D] text-[#233730] shadow-sm font-bold' : 'hover:bg-white text-[#4F433E] border border-transparent'}">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="w-6 h-6 rounded-md ${isActive ? 'bg-[#568A7D] text-white' : 'bg-[#FAF5EE] text-[#7A6B64] border border-[#E6DCD1]'} flex items-center justify-center font-mono font-bold text-[10px] shrink-0">
                  JS${js.number}
                </span>
                <span class="truncate font-medium text-xs">${js.title.replace(/^JOB SHEET\s+\d+:\s*/, '')}</span>
              </div>
              <span class="text-[9px] text-[#7A6B64] font-mono">${js.timeAlloc.split(' ')[0]} JP</span>
            </div>
          `;
        });
      }

      container.innerHTML = html;
      updateSidebarProgress();
    }

    function selectChapter(idx) {
      playSound('click');
      currentChapterIndex = idx;
      currentJobSheetIndex = -1;
      saveState();
      renderActiveSection();
      renderToc();
      scrollToTop();
      if (window.innerWidth < 1024) toggleSidebar();
    }

    function selectJobSheet(idx) {
      playSound('click');
      currentJobSheetIndex = idx;
      setViewMode('jobsheet');
      saveState();
      renderActiveSection();
      renderToc();
      scrollToTop();
      if (window.innerWidth < 1024) toggleSidebar();
    }

    function navigateChapter(dir) {
      playSound('click');
      if (currentJobSheetIndex >= 0) {
        const next = currentJobSheetIndex + dir;
        if (next >= 0 && next < window.BUKU_DATA.jobSheets.length) {
          selectJobSheet(next);
        }
      } else {
        const next = currentChapterIndex + dir;
        if (next >= 0 && next < window.BUKU_DATA.chapters.length) {
          selectChapter(next);
        }
      }
    }

    // Render Active Content (Chapter or JobSheet)
    function renderActiveSection() {
      const container = document.getElementById('reader-body');
      if (!window.BUKU_DATA) return;

      if (currentJobSheetIndex >= 0) {
        renderJobSheetContent(container);
      } else {
        renderChapterContent(container);
      }
      updateNavButtons();
    }

    // Render Chapter (Materi & Interactive Quiz)
    function renderChapterContent(container) {
      const chap = window.BUKU_DATA.chapters[currentChapterIndex];
      if (!chap) return;

      document.getElementById('current-chapter-pill').innerText = chap.numberStr;

      let html = '';

      // Header Chapter Card
      html += `
        <div class="border-b border-[#E6DCD1] pb-6 mb-8">
          <div class="flex items-center gap-2 mb-2 flex-wrap">
            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold uppercase tracking-wider bg-[#DCEBE4] text-[#233730] border border-[#B5CCC3]">
              Modul Pembelajaran Kejuruan
            </span>
            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-mono text-[#7A6B64] bg-[#FAF5EE] border border-[#E6DCD1]">
              ${chap.numberStr} (Kelas XI/XII SMK)
            </span>
            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-mono text-[#EA734F] bg-[#FCE6DD] border border-[#FDBA74]">
              10 Soal Kuis AKM
            </span>
          </div>
          <h2 class="text-2xl sm:text-3xl font-heading font-extrabold text-[#2B221E] leading-tight">
            ${chap.title}
          </h2>
          <p class="text-xs sm:text-sm text-[#7A6B64] mt-2">
            Disusun oleh: <strong class="text-[#2B221E]">${window.BUKU_DATA.meta.author}</strong> | Sesuai Standar Kemendikbudristek & AWS D1.1
          </p>
        </div>
      `;

      // If Mode is 'read' or 'all', render all theory blocks
      if (activeViewMode !== 'quiz') {
        html += `<div class="space-y-6 text-[#382D28] leading-relaxed text-sm sm:text-base">`;

        chap.blocks.forEach(block => {
          // Hide any residual quiz heading or answer key titles in theory mode
          if (block.text && (
            /kunci\s*jawaban/i.test(block.text) || 
            /pembahasan\s*latihan\s*soal/i.test(block.text) ||
            /latihan\s*soal\s*pilihan\s*ganda/i.test(block.text) ||
            /asesmen\s*kognitif.*bank\s*\d+\s*soal/i.test(block.text)
          )) {
            return;
          }
          if (block.type === 'h1') {
            html += `<h3 class="text-xl sm:text-2xl font-heading font-bold text-[#2B221E] mt-8 mb-4 border-l-4 border-[#EA734F] pl-3">${block.text}</h3>`;
          } else if (block.type === 'h2') {
            if (/asesmen\s*(esai|kasus)/i.test(block.text)) {
              html += `
                <div class="my-6 p-4 rounded-2xl bg-gradient-to-r from-[#FAF5EE] to-[#FCE6DD] border-2 border-[#EA734F]/40 flex items-center justify-between gap-4 flex-wrap">
                  <div>
                    <h4 class="font-heading font-extrabold text-[#2B221E] text-base flex items-center gap-2">
                      <i class="fa-solid fa-pen-nib text-[#EA734F]"></i>
                      <span>${block.text}</span>
                    </h4>
                    <p class="text-xs text-[#7A6B64] mt-0.5">Soal uraian studi kasus analitis dapat Anda kerjakan langsung pada lembar interaktif di bagian bawah.</p>
                  </div>
                  <button onclick="scrollToEssay('${chap.id}')" class="px-4 py-2 rounded-xl bg-[#EA734F] hover:bg-[#D95D39] text-white font-bold text-xs shadow-md transition flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span>Kerjakan Essay &darr;</span>
                  </button>
                </div>
              `;
            } else {
              html += `<h4 class="text-lg sm:text-xl font-heading font-bold text-[#EA734F] mt-6 mb-3">${block.text}</h4>`;
            }
          } else if (block.type === 'h3') {
            if (/asesmen\s*sumatif/i.test(block.text)) {
              html += `
                <div class="my-6 p-4 rounded-2xl bg-gradient-to-r from-[#FAF5EE] to-[#DCEBE4] border-2 border-[#568A7D]/40 flex items-center justify-between gap-4 flex-wrap">
                  <div>
                    <h4 class="font-heading font-extrabold text-[#2B221E] text-base flex items-center gap-2">
                      <i class="fa-solid fa-graduation-cap text-[#568A7D]"></i>
                      <span>${block.text}</span>
                    </h4>
                    <p class="text-xs text-[#7A6B64] mt-0.5">Soal uraian berjenjang Taksonomi Bloom (C1-C6) dapat Anda ketik langsung dan dinilai pada lembar kerja di bawah.</p>
                  </div>
                  <button onclick="scrollToEssay('${chap.id}')" class="px-4 py-2 rounded-xl bg-[#568A7D] hover:bg-[#40685E] text-white font-bold text-xs shadow-md transition flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span>Kerjakan Essay &darr;</span>
                  </button>
                </div>
              `;
            } else {
              html += `<h5 class="text-base sm:text-lg font-heading font-semibold text-[#D97706] mt-4 mb-2">${block.text}</h5>`;
            }
          } else if (block.type === 'p') {
            // Check for formula or note
            if (block.text.includes('=') && (block.text.includes('C =') || block.text.includes('BA =') || block.text.includes('HI ='))) {
              html += `
                <div class="my-4 p-4 rounded-2xl bg-[#FAF5EE] border-2 border-[#EA734F]/30 text-[#2B221E] font-mono text-sm shadow-inner">
                  <div class="flex items-center gap-2 mb-1 text-[#EA734F] font-bold uppercase text-[10px] tracking-wider">
                    <i class="fa-solid fa-calculator"></i>
                    <span>Formula Teknis Industri</span>
                  </div>
                  <p class="font-bold text-base text-[#2B221E]">${block.text}</p>
                </div>
              `;
            } else {
              html += `<p class="leading-relaxed mb-4 text-justify text-[#382D28]">${block.text}</p>`;
            }
          } else if (block.type === 'bullet') {
            // Cek apakah butir soal essay (Soal C1..C6 atau Studi Kasus)
            if (/^Soal\s+C\d/i.test(block.text) || /^\d+\.\s*(Studi Kasus|Analisis|Mitigasi)/i.test(block.text)) {
              // Dilewati di teks materi biasa karena otomatis dirender pada Lembar Pengerjaan Essay Interaktif di bawah
              return;
            }
            html += `
              <div class="flex items-start gap-2.5 my-2 pl-2">
                <span class="w-2 h-2 rounded-full bg-[#EA734F] mt-2 shrink-0"></span>
                <p class="leading-relaxed flex-1 text-[#382D28]">${block.text}</p>
              </div>
            `;

                  const isRight = sChoice === q.answer;

                    return `<button onclick="scrollToQuestion(${q.number})" class="px-2.5 py-1 rounded-lg bg-[#FEE2E2] hover:bg-[#FCA5A5] text-[#991B1B] border border-[#FCA5A5] font-mono font-bold text-xs transition cursor-pointer">No. ${q.number}</button>`;
                  }
                  return '';
                }).join('')}
              </div>
            ` : ''}

          </div>

          <!-- DAFTAR SOAL EVALUASI (DENGAN TAMPILAN JAWABAN BENAR & PEMBAHASAN) -->
          <div class="space-y-6">
        `;

        quizzes.forEach((q) => {
          const studentChoice = ansObj[q.number] || null;
          const isCorrect = studentChoice === q.answer;
          const isWrong = studentChoice !== null && studentChoice !== q.answer;
          const isUnanswered = studentChoice === null;

          let cardBorderClass = '';
          let numBadgeClass = '';
          let statusBadgeHtml = '';

          if (isCorrect) {

          html += `
            <div id="question-box-${q.number}" data-status="${isCorrect ? 'correct' : (isWrong ? 'wrong' : 'unanswered')}" class="question-card-box ${cardBorderClass} p-5 sm:p-6 rounded-2xl space-y-3.5 transition duration-200">
              
              <!-- Header Baris Soal & Status Penilaian -->

          Object.keys(q.options).forEach(optKey => {
            const optVal = q.options[optKey];
            const isSelected = studentChoice === optKey;
            const isThisCorrect = optKey === q.answer;
            const isThisWrong = isSelected && !isThisCorrect;

            let btnClass = 'opt-btn w-full text-left p-3.5 rounded-xl border text-xs sm:text-sm flex items-start gap-3 transition cursor-default ';
            let badgeClass = 'w-6 h-6 rounded-lg flex items-center justify-center font-mono text-xs shrink-0 mt-0.5 font-bold ';
            let labelTag = '';

            if (isThisCorrect) {
              btnClass += 'bg-[#E6F4EA] border-2 border-[#166534] text-[#166534] font-bold shadow-xs';
              badgeClass += 'bg-[#166534] text-white';
              labelTag = `<span class="px-2.5 py-0.5 rounded-lg bg-[#166534] text-white text-[10px] font-extrabold uppercase tracking-wide flex items-center gap-1 shrink-0"><i class="fa-solid fa-check"></i> Kunci Benar</span>`;

              btnClass += 'bg-[#FEE2E2] border-2 border-[#DC2626] text-[#991B1B] font-bold shadow-xs';

              labelTag = `<span class="px-2.5 py-0.5 rounded-lg bg-[#DC2626] text-white text-[10px] font-extrabold uppercase tracking-wide flex items-center gap-1 shrink-0"><i class="fa-solid fa-xmark"></i> Pilihan Anda (Salah)</span>`;

              btnClass += 'bg-white/60 border-[#E6DCD1] text-[#7A6B64] opacity-50';

            html += `
              <div class="${btnClass}">

          html += `</div>`;

          // Kotak Evaluasi Pembelajaran & Pembahasan Ilmiah
          html += `
            <div class="mt-4 p-4 sm:p-5 rounded-2xl ${isCorrect ? 'bg-[#F0FDF4] border-2 border-[#86EFAC]' : 'bg-[#FAF5EE] border-2 border-[#EA734F]'} shadow-sm space-y-2.5">
              <div class="flex items-center justify-between gap-2 flex-wrap">

                  <span>Evaluasi Pembelajaran Soal ${q.number}</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-[11px] text-[#7A6B64] font-medium">Kunci Jawaban yang Benar:</span>

              ${!isCorrect ? `

                <strong class="text-[#2B221E] block font-heading font-bold text-xs uppercase tracking-wide">

                </strong>

          html += `</div>`;
        });

        html += `
          </div>

          <!-- Tindak Lanjut Evaluasi di Bawah Soal -->
          <div class="mt-8 p-6 rounded-3xl bg-white border-2 border-[#E6DCD1] shadow-clay-card flex flex-col sm:flex-row sm:items-center justify-between gap-4">

                  <i class="fa-solid fa-arrow-right"></i>
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }

      html += `</div>`;
      return html;
    }

    // Quiz Interaction Handlers
    function selectOption(chapId, questionNumber, optionKey) {
      if (quizSubmitted[chapId]) return;
      playSound('click');
      if (!studentAnswers[chapId]) studentAnswers[chapId] = {};
      studentAnswers[chapId][questionNumber] = optionKey;
      saveState();

      // Update button selection state directly in DOM without full page re-render (smooth & no scroll jump!)
      const qBox = document.getElementById(`question-box-${questionNumber}`);
      if (qBox) {
        const btns = qBox.querySelectorAll('.opt-btn');
        btns.forEach(btn => {
          const key = btn.getAttribute('data-opt');
          const indicator = btn.querySelector('.opt-indicator');
          if (key === optionKey) {
            btn.classList.add('is-selected');
            if (indicator) {
              indicator.innerHTML = '<i class="fa-solid fa-circle-dot text-[#EA734F] text-base shrink-0 mt-0.5"></i>';
            }
          } else {
            btn.classList.remove('is-selected');
            if (indicator) {
              indicator.innerHTML = '<i class="fa-regular fa-circle text-[#D3C5B8] text-base shrink-0 mt-0.5"></i>';
            }
          }
        });
      }

      // Update answered count & progress bars
      updateQuizAnsweredCount(chapId);
    }

    function updateQuizAnsweredCount(chapId) {
      const chap = window.BUKU_DATA ? window.BUKU_DATA.chapters.find(c => c.id === chapId) : null;
      if (!chap || !chap.quizzes) return;
      const ansObj = studentAnswers[chapId] || {};
      const answered = Object.keys(ansObj).length;
      const total = chap.quizzes.length;
      const pct = total > 0 ? Math.round((answered / total) * 100) : 0;

      const countEls = document.querySelectorAll(`.answered-count-${chapId}`);
      countEls.forEach(el => { el.innerText = `${answered} / ${total}`; });

      const barEls = document.querySelectorAll(`.quiz-progress-bar-${chapId}`);
      barEls.forEach(el => { el.style.width = `${pct}%`; });

      const statusEl = document.getElementById(`quiz-status-msg-${chapId}`);
      if (statusEl) {
        if (answered === total) {
          statusEl.innerHTML = '<span class="text-[#166534] font-bold"><i class="fa-solid fa-circle-check mr-1"></i>Seluruh soal telah dijawab! Siap dinilai.</span>';
        } else {
          statusEl.innerHTML = `<span>Masih ada <strong>${total - answered}</strong> butir soal yang belum dijawab.</span>`;
        }
      }
    }

    function submitQuiz(chapId) {
      const chap = window.BUKU_DATA ? window.BUKU_DATA.chapters.find(c => c.id === chapId) : null;
      if (!chap || !chap.quizzes) return;
      const ansObj = studentAnswers[chapId] || {};
      const totalQ = chap.quizzes.length;
      const answered = Object.keys(ansObj).length;

      if (answered < totalQ) {
        const unans = totalQ - answered;
        if (!confirm(`Perhatian: Anda baru menjawab ${answered} dari ${totalQ} butir soal.\n\nMasih ada ${unans} soal yang belum dijawab. Apakah Anda yakin ingin menyelesaikan kuis dan melihat hasil evaluasi pembelajaran sekarang?`)) {
          return;
        }
      }

      quizSubmitted[chapId] = true;
      saveState();

      const scoreData = getChapterScore(chapId);
      if (scoreData.score >= 75) {
        playSound('fanfare');
      } else {
        playSound('wrong');
      }

      // Sync score to parent MetalVerseFery (for Google Spreadsheet & Active Student Record)
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'METALVERSE_QUIZ_COMPLETED',
            chapId: chapId,
            chapTitle: chap.title || `Bab ${chapId}`,
            score: scoreData.score,
            correct: scoreData.correct,
            total: scoreData.total
          }, '*');
        }
      } catch (err) {
        console.warn('Could not postMessage to parent:', err);
      }

      renderActiveSection();
      renderToc();
      updateSidebarProgress();

      // Smoothly scroll to top of evaluation result card
      setTimeout(() => {
        const resultPanel = document.getElementById(`quiz-result-panel-${chapId}`) || document.getElementById(`quiz-section-${chapId}`);
        if (resultPanel) {
          resultPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }, 100);
    }

    function retakeQuiz(chapId) {
      playSound('click');
      if (studentAnswers[chapId]) delete studentAnswers[chapId];
      if (quizSubmitted[chapId]) delete quizSubmitted[chapId];
      saveState();
      renderActiveSection();
      renderToc();
      updateSidebarProgress();

      setTimeout(() => {
        const sec = document.getElementById(`quiz-section-${chapId}`);
        if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    function resetAllQuizzes() {
      if (confirm('Apakah Anda yakin ingin mengosongkan seluruh lembar jawaban dan mereset status evaluasi semua kuis?\n\nSemua kuis akan kembali bersih dengan kunci jawaban disembunyikan untuk siswa baru.')) {
        studentAnswers = {};
        quizSubmitted = {};
        saveState();
        renderActiveSection();
        renderToc();
        updateSidebarProgress();
        alert('Seluruh lembar kuis berhasil direset! Semua kunci jawaban telah disembunyikan.');
      }
    }

    function getChapterScore(chapId) {
      const chap = window.BUKU_DATA ? window.BUKU_DATA.chapters.find(c => c.id === chapId) : null;
      if (!chap || !chap.quizzes) return { score: 0, correct: 0, wrong: 0, unanswered: 0, total: 0 };
      const ansObj = studentAnswers[chapId] || {};
      let correct = 0;
      let wrong = 0;
      let unanswered = 0;
      chap.quizzes.forEach(q => {
        const choice = ansObj[q.number];
        if (!choice) {
          unanswered++;
        } else if (choice === q.answer) {
          correct++;
        } else {
          wrong++;
        }
      });
      const total = chap.quizzes.length;
      const score = total > 0 ? Math.round((correct / total) * 100) : 0;
      return { score, correct, wrong, unanswered, total };
    }

    let currentQuizFilter = 'all';
    function setQuizFilter(filt) {
      currentQuizFilter = filt;
      playSound('click');
      const chap = window.BUKU_DATA ? window.BUKU_DATA.chapters[currentChapterIndex] : null;
      if (!chap) return;
      const chapId = chap.id;

      ['all', 'wrong', 'correct'].forEach(f => {
        const btn = document.getElementById(`qfilter-${f}-${chapId}`);
        if (btn) {
          if (f === filt) {
            btn.className = 'px-2.5 py-1 rounded-lg font-bold bg-[#EA734F] text-white transition cursor-pointer shadow-xs';
          } else {
            btn.className = 'px-2.5 py-1 rounded-lg font-semibold text-[#7A6B64] hover:bg-[#FAF5EE] transition cursor-pointer';
          }
        }
      });

      const cards = document.querySelectorAll('.question-card-box');
      cards.forEach(card => {
        const status = card.getAttribute('data-status');
        if (filt === 'all') {
          card.classList.remove('hidden');
        } else if (filt === 'wrong') {
          if (status === 'wrong' || status === 'unanswered') {
            card.classList.remove('hidden');
          } else {
            card.classList.add('hidden');
          }
        } else if (filt === 'correct') {
          if (status === 'correct') {
            card.classList.remove('hidden');
          } else {
            card.classList.add('hidden');
          }
        }
      });
    }

      const scoreEl = document.getElementById('sidebar-total-score');

    const DEFAULT_SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxfZJ7pdx4BcJ9JjNkkX_KeQzz4ieFH65Xwz5DPMEYID41gYfgfzKoZr3U2Yg06_sM11Q/exec';

    async function syncGradeToLab(chapId) {
      playSound('correct');
      const scoreData = getChapterScore(chapId);
      const chap = window.BUKU_DATA.chapters.find(c => c.id === chapId) || { title: `Bab ${chapId}` };
      
      let user = { name: 'Siswa TPFL', noAbsen: '01', kelas: 'XI TPFL', asalSekolah: 'SMKN 2 Depok Sleman' };
      try {
        const rawUser = localStorage.getItem('metalverse_user_session');
        if (rawUser) user = JSON.parse(rawUser);
      } catch(e) {}

      const now = new Date();
      const timestamp = now.toLocaleDateString('id-ID', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });

      const payload = {
        timestamp: timestamp,
        noAbsen: user.noAbsen || '01',
        nama: user.name || 'Siswa',
        kelas: user.kelas || 'XI TPFL',
        asalSekolah: user.asalSekolah || 'SMKN 2 Depok Sleman',
        role: 'student',
        kategori: `Kuis Buku: ${chap.title || chapId.toUpperCase()}`,
        rincianTugas: `Evaluasi ${chapId.toUpperCase()}: ${scoreData.correct}/${scoreData.total} Benar`,
        skor: scoreData.score,
        xp: Math.round(scoreData.score * 1.5),
        status: scoreData.score >= 75 ? 'Kompeten (Tuntas Kuis)' : 'Perlu Remedial',
        catatan: `Sinkronisasi langsung dari modul buku digital ${chapId}`
      };

      const customSheetsUrl = localStorage.getItem('metalverse_sheets_url');
      const sheetsUrl = (customSheetsUrl && customSheetsUrl.startsWith('http')) ? customSheetsUrl : DEFAULT_SHEETS_URL;

      try {
        await fetch(sheetsUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.warn('Sheets sync error:', err);
      }

      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'METALVERSE_QUIZ_COMPLETED',
            chapId: chapId,
            chapTitle: chap.title || `Bab ${chapId}`,
            score: scoreData.score,
            correct: scoreData.correct,
            total: scoreData.total,
            payload: payload
          }, '*');
        }
      } catch (err) {}

      alert(`✅ Berhasil! Nilai ${chapId.toUpperCase()} (${scoreData.score}/100) telah disinkronkan ke Google Spreadsheet Guru!`);
    }

    // Ekstraksi Soal Essay Dinamis dari Konten Buku
    function getChapterEssayQuestions(chap) {
      if (!chap || !chap.blocks) return [];
      const essays = [];

      chap.blocks.forEach((block) => {
        if (block.type === 'bullet' && block.text) {
          const txt = block.text.trim();
          const matchBloom = txt.match(/^Soal\s+(C\d)\s*\(([^)]+)\)\s*:\s*([\s\S]+)$/i);
          const matchCase = txt.match(/^(\d+)\.\s*(Studi Kasus|Analisis|Mitigasi)([^:]*):\s*([\s\S]+)$/i);

          if (matchBloom) {
            const code = matchBloom[1].toUpperCase();
            const level = matchBloom[2].trim();
            const qText = matchBloom[3].trim();
            const qNum = essays.length + 1;

            let colorClass = 'bg-[#E0F2FE] text-[#0369A1] border-[#BAE6FD]';
            if (code === 'C2') colorClass = 'bg-[#EEF2FF] text-[#4338CA] border-[#C7D2FE]';
            if (code === 'C3') colorClass = 'bg-[#ECFDF5] text-[#047857] border-[#A7F3D0]';
            if (code === 'C4') colorClass = 'bg-[#FEF3C7] text-[#B45309] border-[#FDE68A]';
            if (code === 'C5') colorClass = 'bg-[#FFE4E6] text-[#BE123C] border-[#FECDD3]';
            if (code === 'C6') colorClass = 'bg-[#F3E8FF] text-[#7E22CE] border-[#E9D5FF]';

            essays.push({
              index: qNum,
              code: code,
              level: `${code} - ${level}`,
              title: `Soal ${code} (${level})`,
              question: qText,
              colorClass: colorClass,
              category: 'bloom',
              hint: getRubricHintForQuestion(chap.id, code, qNum),
              keywords: getKeywordsForQuestion(chap.id, code, qNum)
            });
          } else if (matchCase) {
            const caseNum = matchCase[1];
            const caseTitle = (matchCase[2] + matchCase[3]).trim();
            const qText = matchCase[4].trim();
            const qNum = essays.length + 1;

            essays.push({
              index: qNum,
              code: `KASUS_${caseNum}`,
              level: `Kasus ${caseNum} - ${caseTitle}`,
              title: `${caseTitle} (Kasus ${caseNum})`,
              question: qText,
              colorClass: 'bg-[#FCE6DD] text-[#C2410C] border-[#FDBA74]',
              category: 'case_study',
              hint: getRubricHintForQuestion(chap.id, `KASUS_${caseNum}`, qNum),
              keywords: getKeywordsForQuestion(chap.id, `KASUS_${caseNum}`, qNum)
            });
          }
        }
      });

      return essays;
    }

    // Helper Hitung Kata & Keyword
    function countWords(str) {
      if (!str) return 0;
      const words = str.trim().split(/\s+/).filter(w => w.length > 0);
      return words.length;
    }

    function countKeywordMatches(text, keywords) {
      if (!text || !keywords || keywords.length === 0) return 0;
      const lower = text.toLowerCase();
      let count = 0;
      keywords.forEach(kw => {
        if (lower.includes(kw.toLowerCase())) count++;
      });
      return count;
    }

    // Engine Penilaian Essay Otomatis Berbasis Rubrik & Kata Kunci
    function gradeChapterEssay(chapId) {
      const chap = window.BUKU_DATA.chapters.find(c => c.id === chapId);
      if (!chap) return;
      const essays = getChapterEssayQuestions(chap);
      if (essays.length === 0) return;

      const answers = (studentEssayAnswers[chapId]) || {};
      let totalScore = 0;
      let filledCount = 0;

      essays.forEach(q => {
        const ans = (answers[q.index] || '').trim();
        const wCount = countWords(ans);
        let qScore = 0;
        let feedback = '';

        if (wCount === 0) {
          qScore = 0;
          feedback = 'Belum diisi. Silakan ketikkan jawaban teknis Anda pada kolom di atas.';
        } else if (wCount < 8) {
          qScore = 40;
          feedback = 'Jawaban terlalu singkat. Uraikan argumen teknis atau langkah kerja lebih lengkap.';
          filledCount++;
        } else {
          filledCount++;
          let base = Math.min(80, 55 + Math.round((wCount / 25) * 25));
          const matches = countKeywordMatches(ans, q.keywords || []);
          let kwBonus = Math.min(20, matches * 5);

          qScore = Math.min(100, base + kwBonus);
          if (qScore >= 85) {
            feedback = 'Sangat Kompeten! Uraian lengkap, analitis, dan memuat istilah/prinsip teknis kejuruan dengan tepat.';
          } else if (qScore >= 75) {
            feedback = 'Kompeten. Konsep inti sudah dipahami dengan baik dan memenuhi standar evaluasi.';
          } else {
            feedback = 'Cukup. Jawaban sudah mengarah pada topik, tetapi perlu melengkapi aspek prosedur teknis.';
          }
        }

        totalScore += qScore;
        q.score = qScore;
        q.feedback = feedback;
      });

      const avgScore = essays.length > 0 ? Math.round(totalScore / essays.length) : 0;
      essayScores[chapId] = {
        score: avgScore,
        filledCount: filledCount,
        total: essays.length,
        gradedAt: new Date().toISOString()
      };
      saveState();

      if (avgScore >= 75) {
        playSound('fanfare');
      } else {
        playSound('correct');
      }

      renderActiveSection();

      setTimeout(() => {
        const el = document.getElementById(`essay-section-${chapId}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);

      return essayScores[chapId];
    }

    // Render Kartu Rekapitulasi Gabungan (PG + Essay) & Sinkronisasi

              <span class="text-[10px] font-mono font-bold uppercase tracking-wider text-[#7A6B64] block">Kuis Pilihan Ganda (50%)</span>
              <div class="text-2xl sm:text-3xl font-mono font-extrabold text-[#EA734F]">
                ${isPgSubmitted ? pgScoreData.score : '-'}<span class="text-xs text-[#7A6B64] font-normal"> / 100</span>
              </div>
              <span class="text-[11px] text-[#7A6B64] block">

            </div>

            <!-- 2. Skor Essay -->
            <div class="p-4 rounded-2xl bg-white border border-[#E6DCD1] shadow-xs text-center space-y-1">
              <span class="text-[10px] font-mono font-bold uppercase tracking-wider text-[#568A7D] block">Uraian / Essay HOTS (50%)</span>

                ${essayData ? essayData.score : '-'}<span class="text-xs text-[#7A6B64] font-normal"> / 100</span>
              </div>
              <span class="text-[11px] text-[#7A6B64] block">
                ${essayData ? `${essayData.filledCount} / ${essays.length} Soal Dinilai` : 'Essay belum dinilai'}
              </span>
            </div>

            <!-- 3. Nilai Akhir Gabungan -->
            <div class="p-4 rounded-2xl ${isOverallPassed && (isPgSubmitted || essayData) ? 'bg-[#F0FDF4] border-2 border-[#86EFAC]' : 'bg-white border border-[#E6DCD1]'} shadow-xs text-center space-y-1">

                ${(isPgSubmitted || essayData) ? combinedScore : '-'}<span class="text-xs text-[#7A6B64] font-normal"> / 100</span>

        function jumpToQuiz() {
      playSound('click');
      const chap = window.BUKU_DATA.chapters[currentChapterIndex];
      if (!chap) return;
      const sec = document.getElementById(`quiz-section-${chap.id}`);
      if (sec) {
        sec.scrollIntoView({ behavior: 'smooth' });
      } else {
        setViewMode('quiz');
      }
    }

    function scrollToTop() {
      document.getElementById('main-content-viewport').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleContentScroll() {
      const vp = document.getElementById('main-content-viewport');
      const max = vp.scrollHeight - vp.clientHeight;
      const current = vp.scrollTop;
      const pct = max > 0 ? Math.min(100, Math.round((current / max) * 100)) : 0;
      document.getElementById('reading-progress-bar').style.width = `${pct}%`;
    }

    function updateNavButtons() {
      const prevBtn = document.getElementById('btn-prev-chap');
      const nextBtn = document.getElementById('btn-next-chap');
      const prevLbl = document.getElementById('btn-prev-label');
      const nextLbl = document.getElementById('btn-next-label');

      if (currentJobSheetIndex >= 0) {
        prevBtn.disabled = currentJobSheetIndex === 0;
        nextBtn.disabled = currentJobSheetIndex === window.BUKU_DATA.jobSheets.length - 1;
        prevLbl.innerText = currentJobSheetIndex > 0 ? `Job Sheet ${currentJobSheetIndex}` : 'Awal Praktik';
        nextLbl.innerText = currentJobSheetIndex < window.BUKU_DATA.jobSheets.length - 1 ? `Job Sheet ${currentJobSheetIndex + 2}` : 'Selesai';
      } else {
        prevBtn.disabled = currentChapterIndex === 0;
        nextBtn.disabled = currentChapterIndex === window.BUKU_DATA.chapters.length - 1;
        prevLbl.innerText = currentChapterIndex > 0 ? window.BUKU_DATA.chapters[currentChapterIndex - 1].numberStr : 'Awal Modul';
        nextLbl.innerText = currentChapterIndex < window.BUKU_DATA.chapters.length - 1 ? window.BUKU_DATA.chapters[currentChapterIndex + 1].numberStr : 'Akhir Modul';
      }
    }

    // Book Search
    function handleBookSearch(e) {
      if (e.key === 'Enter') executeBookSearch();
    }

    function executeBookSearch() {
      const q = document.getElementById('book-search-input').value.trim().toLowerCase();
      if (!q || q.length < 2) return;
      playSound('click');

      const results = [];
      window.BUKU_DATA.chapters.forEach((chap, cIdx) => {
        chap.blocks.forEach(b => {
          if (b.text && b.text.toLowerCase().includes(q)) {
            results.push({
              type: 'chapter',
              index: cIdx,
              chapTitle: chap.title,
              snippet: getSnippet(b.text, q)
            });
          }
        });
        if (chap.quizzes) {
          chap.quizzes.forEach(qz => {
            if (qz.question.toLowerCase().includes(q) || (qz.explanation && qz.explanation.toLowerCase().includes(q))) {
              results.push({
                type: 'quiz',
                index: cIdx,
                chapTitle: `${chap.numberStr} (Kuis No. ${qz.number})`,
                snippet: getSnippet(qz.question, q)
              });
            }
          });
        }
      });

      const panel = document.getElementById('search-results-panel');
      const list = document.getElementById('search-results-list');
      document.getElementById('search-query-text').innerText = q;

      if (results.length === 0) {
        list.innerHTML = `<p class="text-slate-400 py-2">Tidak ditemukan materi dengan kata kunci "${q}".</p>`;
      } else {
        list.innerHTML = results.slice(0, 10).map(r => `
          <div onclick="selectChapter(${r.index}); closeSearchResults();" class="p-3 rounded-xl bg-slate-950/80 hover:bg-slate-800 border border-slate-800 cursor-pointer transition">
            <span class="text-cyan-400 font-bold text-xs block mb-1">${r.chapTitle}</span>
            <p class="text-slate-300 text-[11px] leading-relaxed">${r.snippet}</p>
          </div>
        `).join('');
      }

      panel.classList.remove('hidden');
    }

    function closeSearchResults() {
      document.getElementById('search-results-panel').classList.add('hidden');
    }

    function getSnippet(text, q) {
      const idx = text.toLowerCase().indexOf(q);
      const start = Math.max(0, idx - 40);
      const end = Math.min(text.length, idx + q.length + 60);
      const snip = text.substring(start, end);
      return (start > 0 ? '...' : '') + snip.replace(new RegExp(q, 'gi'), match => `<mark class="bg-amber-400 text-slate-950 px-1 rounded font-bold">${match}</mark>`) + (end < text.length ? '...' : '');
    }

    // Image Lightbox
    function openImageModal(src, caption) {
      playSound('click');
      document.getElementById('modal-img-tag').src = src;
      document.getElementById('modal-caption-text').innerText = caption;
      document.getElementById('image-modal').classList.remove('hidden');
    }

    function closeImageModal() {
      document.getElementById('image-modal').classList.add('hidden');
    }

    function escapeQuotes(str) {
      if (!str) return '';
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function parseUrlParams() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        const chap = urlParams.get('chap');
        const js = urlParams.get('js');

        if (chap) {
          const cIdx = parseInt(chap, 10) - 1;
          if (cIdx >= 0 && cIdx < window.BUKU_DATA.chapters.length) {
            currentChapterIndex = cIdx;
            currentJobSheetIndex = -1;
          }
        }
        if (js) {
          const jIdx = parseInt(js, 10) - 1;
          if (jIdx >= 0 && jIdx < window.BUKU_DATA.jobSheets.length) {
            currentJobSheetIndex = jIdx;
            activeViewMode = 'jobsheet';
          }
        }
        if (urlParams.get('fresh') === '1' || urlParams.get('reset') === '1') {
          studentAnswers = {};
          quizSubmitted = {};
          saveState();
        }
        if (mode && ['read', 'quiz', 'jobsheet'].includes(mode)) {
          activeViewMode = mode;
        }
      } catch (e) {
        console.warn('URL param parse error:', e);
      }
    }

    // Initialize Page
    window.addEventListener('DOMContentLoaded', () => {
      loadSavedState();
      updateStudentSessionPill();
      parseUrlParams();
      
      // Update UI button highlights based on activeViewMode
      if (activeViewMode === 'quiz') {
        document.querySelectorAll('#mode-btn-read, #mode-btn-quiz, #mode-btn-jobsheet').forEach(b => {
          b.className = 'px-3 py-1 rounded-lg font-semibold text-[#7A6B64] hover:text-[#2B221E] transition flex items-center gap-1.5 cursor-pointer';
        });
        document.getElementById('mode-btn-quiz').className = 'px-3 py-1 rounded-lg font-bold transition bg-[#EA734F] text-white shadow-xs flex items-center gap-1.5 cursor-pointer';
      } else if (activeViewMode === 'jobsheet') {
        document.querySelectorAll('#mode-btn-read, #mode-btn-quiz, #mode-btn-jobsheet').forEach(b => {
          b.className = 'px-3 py-1 rounded-lg font-semibold text-[#7A6B64] hover:text-[#2B221E] transition flex items-center gap-1.5 cursor-pointer';
        });
        document.getElementById('mode-btn-jobsheet').className = 'px-3 py-1 rounded-lg font-bold transition bg-[#568A7D] text-white shadow-xs flex items-center gap-1.5 cursor-pointer';
      }

      renderToc();
      renderActiveSection();
    });
  </script>
